[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musubi"
version = "0.1.0"
description = "Musubi — shared ontology + verification platform for robotics × business agents × external systems"
readme = "PROJECT.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "linkml>=1.7",
    "linkml-runtime>=1.7",
    "duckdb>=0.10",
    "mujoco>=3.1",
    "imageio>=2.34",
    "Pillow>=10.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Cloud SDKs — only needed for VCR record/passthrough (live LLMs). Offline core never imports these.
live = [
    "google-genai>=0.3",
    "google-adk>=0.1",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = [
    "ontology",
    "core",
    "sim",
    "perception",
    "agents",
    "external",
    "clients",
    "bench",
    "scoreboard",
    "config",
    "console",
]

[tool.hatch.metadata]
allow-direct-references = true

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ontology/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["ontology", "core", "sim", "perception", "agents", "external", "clients", "bench", "scoreboard", "config"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
exclude = ["ontology/generated", "build", "external/docs"]

# Third-party libs without stubs — silence import errors, keep our code strict.
[[tool.mypy.overrides]]
module = [
    "mujoco.*", "duckdb.*", "pyshacl.*", "rdflib.*", "linkml.*", "linkml_runtime.*",
    "imageio.*", "PIL.*", "google.*", "anthropic.*", "yaml.*", "jsonschema.*",
    "ontology.generated.*",  # generated pydantic types (excluded from checking; imported as data)
]
ignore_missing_imports = true

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that require live Gemini API (skipped in offline/replay CI)",
    "slow: slow tests (sim rollouts, rendering)",
]
filterwarnings = ["ignore::DeprecationWarning"]
