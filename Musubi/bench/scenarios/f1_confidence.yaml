# F1 — Confidence-driven inventory (Scenario Catalog §1, the recommended first flagship). Audit asks
# for a 95%-confidence inventory; the system verifies only the low-confidence stock, detects the
# planted discrepancies, and files corrections — proving cost < full count.
name: f1_confidence
experiment: E2
description: >-
  Prove inventory at a confidence level without a full stop-and-scan. Build a confidence map, verify
  only the decayed/low-confidence items, catch the planted book/reality divergences.
goal:
  type: confidence_audit
  level: 0.95
arms: [A4]
seeds: [0, 1, 2]
invisible_hand:
  - {op: move, pallet: pallet_2, x: 1.2, y: -1.2}   # moved to shipping (book still says receiving)
  - {op: degrade_tag, pallet: pallet_2}             # -> low confidence -> gets verified
  - {op: move, pallet: pallet_3, x: 1.2, y: 1.2}    # moved to quarantine
  - {op: degrade_tag, pallet: pallet_3}
norms: []
oracle: [planted_discrepancies_found, cost_reduced_vs_full_count, corrections_filed]
