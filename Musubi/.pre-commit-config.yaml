# pre-commit — ruff, secret detection, mermaid validation (CLAUDE.md §1).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^ontology/  # LinkML/SHACL yaml handled by make gen
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mermaid-check
        name: mermaid syntax check
        entry: python scripts/check_mermaid.py
        language: system
        files: \.md$
        pass_filenames: false
