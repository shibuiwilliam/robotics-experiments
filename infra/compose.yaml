# SBP ローカル開発基盤（設計書 §12、infra-testing ルール）。
#
# 既定サービスは 4 つだけ: redpanda / postgres(timescaledb-ha + pgvector) / oxigraph / objectstore。
# サービス追加は ADR 必須（「便利だからと Redis 等を増やす」は CLAUDE.md の禁止事項）。
# mem_limit の合計は 6 GB 以内（redpanda 2G + postgres 2G + oxigraph 1G + objectstore 1G = 6G）。
#
# 任意 profile: ui / observability / console。

name: sbp

x-platform: &platform
  platform: ${SBP_PLATFORM:-linux/arm64}

services:
  # ---- イベントログ（記録源）-------------------------------------------------
  redpanda:
    <<: *platform
    image: redpandadata/redpanda:v24.2.7
    container_name: sbp-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${SBP_PORT_KAFKA:-9092}:9092"
      - "${SBP_PORT_REDPANDA_ADMIN:-9644}:9644"
    volumes:
      - sbp_rp:/var/lib/redpanda/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---- 時系列・潜在索引・投影（TimescaleDB + pgvector）----------------------
  postgres:
    <<: *platform
    image: timescale/timescaledb-ha:pg16.15-ts2.30.2
    container_name: sbp-postgres
    environment:
      POSTGRES_USER: ${SBP_PG_USER:-sbp}
      POSTGRES_PASSWORD: ${SBP_PG_PASSWORD:-sbp}
      POSTGRES_DB: ${SBP_PG_DB:-sbp}
    ports:
      - "${SBP_PORT_POSTGRES:-5432}:5432"
    volumes:
      - sbp_pg:/home/postgres/pgdata/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SBP_PG_USER:-sbp} -d ${SBP_PG_DB:-sbp}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---- 知識グラフ（SPARQL 1.1 + RDF-star）----------------------------------
  oxigraph:
    <<: *platform
    # 組み込み pyoxigraph（単体テスト用）と同じ 0.5.11 に固定し、ストア形式と
    # RDF-star の扱いを一致させる。ghcr.io には 0.5 系が無いため Docker Hub の公式配布を使う。
    image: oxigraph/oxigraph:0.5.11
    container_name: sbp-oxigraph
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    ports:
      - "${SBP_PORT_OXIGRAPH:-7878}:7878"
    volumes:
      - sbp_ox:/data
    mem_limit: 1g
    # healthcheck を付けていない唯一のサービス（ADR-0004）。このイメージは distroless で
    # シェルも wget も無く、CLI の `oxigraph query` は --location（ローカルストア）しか取れない。
    # 稼働中のサーバと同じ location を開くと RocksDB のロックで競合するため、コンテナ内から
    # HTTP エンドポイントの疎通を確認する手段が存在しない。
    # 疎通検査は tests/integration/conftest.py とワーカー起動時に SPARQL で行う。

  # ---- raw 層・モデル重み（S3 互換）----------------------------------------
  # 実装は SeaweedFS（ADR-0003: MinIO の公開イメージが匿名取得できなくなったため置換）。
  # サービス名を実装名にしないのは、S3 互換という契約だけが上位層との約束だから。
  objectstore:
    <<: *platform
    image: chrislusf/seaweedfs:3.80
    container_name: sbp-objectstore
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=9000
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=256
      - -metricsPort=9321
    ports:
      - "${SBP_PORT_S3:-9000}:9000"
    volumes:
      - sbp_s3:/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---- 任意 profile ---------------------------------------------------------
  console:
    <<: *platform
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: sbp-console
    profiles: ["console"]
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "${SBP_PORT_CONSOLE:-8080}:8080"
    mem_limit: 512m
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/admin/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  # UI（M7-04、ADR-0008）。静的ファイルを配るだけで、API とは別オリジン。
  # ビルドは `make ui-build`（ローカルの Node で行う）。このコンテナはビルドしない——
  # Node のビルド環境をイメージに持つと、Compose 全体の 6 GB 制限を圧迫する。
  ui:
    <<: *platform
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: sbp-ui
    profiles: ["ui"]
    ports:
      - "${SBP_PORT_UI:-5173}:8080"
    volumes:
      - ../apps/ui/dist:/usr/share/nginx/html:ro
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ---- 可観測性（observability profile、M8-06）--------------------------------
  # **既定では起動しない。** 既定 4 サービスの 6 GB 制限（CLAUDE.md）はこの 2 つを含まない。
  # 指標の取り込み先は API の /metrics で、ワーカーは metrics 表に書くだけである——
  # ワーカーごとに HTTP エンドポイントを持たせると 1 ワーカー 1 プロセスでポートが増え続ける。
  prometheus:
    <<: *platform
    image: prom/prometheus:v2.54.1
    container_name: sbp-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 保存期間を切る。開発機のディスクを埋めないため（長期保存は運用環境の仕事）
      - --storage.tsdb.retention.time=15d
      # external_labels の ${VAR} を展開する。**無いと設定が静かに文字列のまま残る**
      # （Prometheus は健全に起動する。所見 66）
      - --enable-feature=expand-external-labels
    environment:
      SBP_SITE_ID: ${SBP_SITE_ID:-siteA}
    ports:
      - "${SBP_PORT_PROMETHEUS:-9090}:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - sbp_prom:/prometheus
    extra_hosts:
      # ホストで `make dev` している API を取り込むため（Linux では自動で入らない）
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ダッシュボードは生成物（scripts/gen_dashboard.py）をプロビジョニングで入れる。
  # UI で編集しても保存されない（allowUiUpdates を立てていない）——指標名の正典は
  # sbp.core.metrics の列挙である。
  grafana:
    <<: *platform
    image: grafana/grafana:11.2.0
    container_name: sbp-grafana
    profiles: ["observability"]
    environment:
      # **開発用の設定である。** 認証を切っているので、ローカル以外に出さない
      # （UI の認証方式が未決なのと同じ理由。ADR-0008 の未決）
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${SBP_PORT_GRAFANA:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - sbp_grafana:/var/lib/grafana
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  sbp_rp:
    name: sbp_rp
  sbp_pg:
    name: sbp_pg
  sbp_ox:
    name: sbp_ox
  sbp_s3:
    name: sbp_s3
  # observability profile のみ。`make nuke` で消える
  sbp_prom:
    name: sbp_prom
  sbp_grafana:
    name: sbp_grafana
