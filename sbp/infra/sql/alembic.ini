# alembic 設定。DDL は必ずマイグレーション経由で流す（手で流さない。knowledge ルール）。
[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../..
version_locations = %(here)s/versions
file_template = %%(rev)s_%%(slug)s
# 接続先は env.py が sbp.core.config.Settings から取る（ここに DSN を書かない）。
sqlalchemy.url =

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
