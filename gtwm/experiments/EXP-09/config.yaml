# EXP-09 連合ツインと漏洩評価。smoke: true で ≤5分の縮小版に切り替わる。
smoke: true
seeds: [0]
probe_config: configs/grounding/probe_train_smoke.yaml
site_b_set: p2_site_b
site_b_seed: 9000 # site_a とは別系統のseed（同一レイアウトを別seedで生成＝模擬第二拠点）
n_episodes: 2
duration_s: 30.0
frame_stride: 10
full_run:
  seeds: [0, 1, 2]
  n_episodes: 20
  probe_config: configs/grounding/probe_train_full.yaml # Phase B Stage 1 で学習
  note: >
    poc_plan.md 6.2 は「本サイトと模擬第二拠点」間の継続的な予測交換を想定。本実行では
    ADR-0002 の最小 HTTP コネクタを実際に Docker (`make up-p2`) 越しに使う構成へ切替え、
    より多くのエピソード・フレームで復元攻撃・再識別攻撃の攻撃者モデルを学習すること。
