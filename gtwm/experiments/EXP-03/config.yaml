# EXP-03 記号条件付けのアブレーション。smoke: true で ≤5分の縮小版に切り替わる。
smoke: true
seeds: [0]
wm_config: configs/wm/smoke.yaml
data_set: wm_smoke
conditioner_impl: rgcn
seq_len: 20
frame_stride: 5
horizons_steps: [2, 4, 8, 16] # frame_stride=5, log_hz=10 -> 実時間 1s/2s/4s/8s
effective_horizon_tau: 0.2 # poc_plan.md 付録A の既定値と一致（configs/grounding/epsilon.yaml参照）
full_run:
  seeds: [0, 1, 2]
  note: "60秒先の比較には30秒超のエピソード（p0_train/p0_eval相当）が必要。smokeは1〜8秒までしか届かない。"
