[project]
name = "gtwm"
version = "0.1.0"
description = "World Model x Ontology intelligent dataspace PoC (gtwm)"
readme = "docs/poc_plan.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pydantic>=2.6",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "python-dotenv>=1.0",
]

[project.scripts]
gtwm = "gtwm.cli:app"

[project.optional-dependencies]
sim = [
    "mujoco>=3.1",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "opencv-python-headless>=4.9",
]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.38",
    "einops>=0.7",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "hdbscan>=0.8",
]
kg = [
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "pyoxigraph>=0.3",
    "lark>=1.1",
]
llm = [
    "anthropic>=0.25",
    "openai>=1.14",
    "google-genai>=0.3",
]
ui = [
    "streamlit>=1.32",
    "plotly>=5.20",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "mlflow>=2.11",
    "pandas>=2.2",
    "pyarrow>=15.0",
]
experimental = [
    # ネイティブビルドが必要な依存はここに隔離する（失敗しても他が動く）。
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtwm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "unit: fast, no external deps",
    "sim: MuJoCo, serial execution",
    "integration: requires Docker services",
]
testpaths = ["tests"]
