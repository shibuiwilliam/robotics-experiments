repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.6]
        files: ^src/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
  - repo: local
    hooks:
      - id: gtwm-kg-validate
        name: gtwm kg validate
        entry: uv run gtwm kg validate
        language: system
        files: ^(ontology/|src/gtwm/kg/queries/)
        pass_filenames: false
