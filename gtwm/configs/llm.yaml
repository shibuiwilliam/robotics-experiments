# LLM タスク割当・料金表（.claude/rules/llm.md）。
# モデル名はここでのみ指定し、コードに書かない（gtwm.llm.client.LLMClient が読む）。
#
# NOTE: 以下のモデル識別子はプレースホルダーであり、実在確認は行っていない
# （`gtwm llm ping` で疎通・実在を確認してから使うこと。llm.md「起動時に gtwm llm
# ping で各プロバイダの疎通と設定モデルの実在を確認し、失敗したらエラーにする」）。
# 使用前に、実際に契約しているプロバイダの最新モデル名に置き換えて確認すること。

tasks:
  # (1) オントロジーのラベル・コメント下書き
  ontology_label_draft:
    provider: anthropic
    model: claude-placeholder-prose
  # (2) SPARQL 候補生成
  sparql_candidate:
    provider: anthropic
    model: claude-placeholder-prose
  # (3) 概念候補の命名と説明（JSON厳格出力）
  concept_naming:
    provider: openai
    model: gpt-placeholder-json
  # (4) 自然言語→WHAT-IF クエリ変換（JSON厳格出力）
  nl_to_whatif:
    provider: openai
    model: gpt-placeholder-json
  # (5) レポート下書き
  report_draft:
    provider: anthropic
    model: claude-placeholder-prose
  # (6) 生成エピソードのQA・LLM-as-judge（映像・画像）
  episode_qa:
    provider: gemini
    model: gemini-placeholder-vision

# 概算費用（USD / 1M トークン）。不明なプロバイダ/モデルは記録時に null として扱い、
# 推定しない（llm.md「費用単価は configs/llm.yaml の pricing から読む。不明なら
# null で記録し、推定しない」）。ここもプレースホルダーであり実額ではない。
pricing:
  claude-placeholder-prose:
    input_per_1m: null
    output_per_1m: null
  gpt-placeholder-json:
    input_per_1m: null
    output_per_1m: null
  gemini-placeholder-vision:
    input_per_1m: null
    output_per_1m: null
  mock-model:
    input_per_1m: 0.0
    output_per_1m: 0.0

retry:
  max_retries: 2
  temperature_for_json_tasks: 0.0
