# make train-smoke 用の縮小設定。3分以内に終わること（world_model.md）。
# エピソード2本、K=8、d=64、2層。
encoder:
  model_name: facebook/dinov2-small
  freeze_backbone: true
  adapter_dim: 32

slots:
  n_slots: 8
  slot_dim: 64
  n_iters: 2
  n_types: 6

fusion:
  n_slots: 8
  slot_dim: 64
  n_heads: 2

dynamics:
  n_layers: 2
  d_model: 64
  n_heads: 2
  ensemble_size: 1
  action_dim: 4
  cond_dim: 16

planner:
  n_samples: 32
  horizon: 5

train:
  data_set: wm_smoke
  seed: 0
  batch_size: 2
  seq_len: 8
  frame_stride: 2
  lr: 3.0e-4
  max_epochs: 2
  max_steps: 6
  early_stop_patience: 5
  checkpoint_dir: runs/wm/checkpoints_smoke
  mlflow_experiment: gtwm-wm-smoke
  loss_weights:
    prediction: 1.0
    anchor_grounding: 0.0
    constraint: 0.0
    identity: 0.0

synthetic_eval:
  horizon: 10
  max_latent_cosine_distance: 0.2
