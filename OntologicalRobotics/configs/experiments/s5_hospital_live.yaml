# S5 病院内搬送 — agent（live）射程（R-B, T12）。課金・要コスト承認。
# 規範オントロジー（禁止規範写像）が、実 LLM の「禁止区画を通らない適合経路」計画を
# 助けるかを測る（H5-隣接の agent 検証。規範/来歴機構の差は決定的アブレーションが担う）。
# OR-full-llm（区画グラフ＋禁止規範写像）/ B1-llm（区画グラフのみ・規範写像なし）。
# 対比較の単位は搬送（transport）。世界は決定的なため seed は反復で違反単位を増やす。
name: s5-hospital-live
scenario: s5
world_config: configs/world/s5_hospital.yaml
conditions: [OR-full-llm, B1-llm]
seeds: [501, 502, 503, 504]
duration_s: 0.0
provider:
  mode: openai
  llm_model: gpt-5.4-mini
