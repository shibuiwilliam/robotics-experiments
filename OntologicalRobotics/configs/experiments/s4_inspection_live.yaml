# S4 プラント点検 — agent（live）射程（R-B, T11）。課金・要コスト承認。
# 視覚署名による ID 無し同定（H2/H4）が、実 LLM の台帳資産↔観測の対応付けを助けるかを測る
# （同一性/信念機構のオン・オフは決定的アブレーションが担う）。
# OR-full-llm（位置＋視覚署名コサイン）/ OR-sym-llm（位置のみ・署名なし）。位置ノイズで曖昧化。
name: s4-inspection-live
scenario: s4
world_config: configs/world/s4_inspection.yaml
conditions: [OR-full-llm, OR-sym-llm]
seeds: [401, 402, 403, 404, 405, 406, 407, 408]
duration_s: 0.0
params:
  position_noise: 0.6  # 位置単独では曖昧 — 視覚署名の価値が立ち上がる過酷域
provider:
  mode: openai
  llm_model: gpt-5.4-mini
