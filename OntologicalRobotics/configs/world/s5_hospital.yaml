# S5 病院内搬送世界（T12）。規範(禁止)が物理通行を支配。custody連鎖の監査。
# 設計意図:
#  - 規制薬物(controlled_drug)は公共区画(public)を通過してはならない（禁止規範）。
#  - pharmacy→ward_a の最短は public_hall 経由(2ホップ・違反)、適合経路は secure 廊下経由(3ホップ)。
#    規範層なしは違反、規範層ありは+1ホップで違反0。
#  - 監査クエリ(規制薬物の全custody連鎖)は来歴記録(全通行)が無いと完全回答できない。
zone_class:
  pharmacy: secure
  ward_a: secure
  ward_b: secure
  public_hall: public
  lobby: public
  secure_corr1: secure
  secure_corr2: secure
  lab: secure
edges:
  - [pharmacy, public_hall]
  - [public_hall, ward_a]
  - [public_hall, lobby]
  - [lobby, ward_b]
  - [pharmacy, secure_corr1]
  - [secure_corr1, secure_corr2]
  - [secure_corr2, ward_a]
  - [secure_corr2, ward_b]
  - [secure_corr1, lab]
transports:
  - {transport_id: t1, item_class: controlled_drug, src: pharmacy, dst: ward_a}
  - {transport_id: t2, item_class: controlled_drug, src: pharmacy, dst: ward_b}
  - {transport_id: t3, item_class: specimen,        src: lab,      dst: ward_a}
  - {transport_id: t4, item_class: linen,           src: ward_b,   dst: lobby}
norms:
  - {item_class: controlled_drug, forbidden_zone_class: public, modality: prohibition}
audited_item_class: controlled_drug
