# S3 多ベンダー製造ライン世界（T10）。異ベンダー3機体・段取り替え・故障(経年劣化)。
# 真プロファイル(true_*)は採点専用で計画器は見ない。能力契約(declared_*)のみが計画の窓。
# 設計意図:
#  - 初期品種 tray(3kg/plastic): 基準ベンダーaの arm_a1 が最良 → 全条件が機能。
#  - 段取り替え engine_block(12kg/metal): a1 は可搬超過。適格は別ベンダーの b1/c1 のみ
#    → B1(共通オントロジー無し=基準ベンダーしか解せない)は届かず失敗、round-robin は能力無視で失敗。
#  - 故障: cobot_b1 が経年劣化(×0.2)。OR-full は台帳追従で agv_c1 へ縮退再割当(回復)。
machines:
  - machine_id: arm_a1
    vendor: vendor_a          # 基準ベンダー（SOPの語彙）
    declared_payload_kg: 5.0
    prior_success: 0.92
    true_payload_kg: 5.0
    true_material_success: {plastic: 0.95, metal: 0.40, default: 0.5}
    degrades: false
  - machine_id: cobot_b1
    vendor: vendor_b
    declared_payload_kg: 20.0
    prior_success: 0.90
    true_payload_kg: 20.0
    true_material_success: {plastic: 0.70, metal: 0.95, default: 0.6}
    degrades: true            # 故障(経年劣化)対象
  - machine_id: agv_c1
    vendor: vendor_c
    declared_payload_kg: 15.0
    prior_success: 0.85
    true_payload_kg: 15.0
    true_material_success: {plastic: 0.60, metal: 0.90, default: 0.6}
    degrades: false
products:
  tray:         {name: tray,         weight_kg: 3.0,  material: plastic}
  engine_block: {name: engine_block, weight_kg: 12.0, material: metal}
initial_product: tray
setup_change_product: engine_block
setup_change_step: 4         # エピソード4以降は新品種
fault_machine: cobot_b1
fault_step: 6                # エピソード6以降に劣化（台帳が追従低下→c1へ縮退）
fault_degradation: 0.2
reference_vendor: vendor_a
# H1 オンボーディング（ベンダーD参入のスキーマ・フィールド）
vendor_d_fields: [payload_max, reach, grip_material, cycle_time, vendor_proto_x, calib_offset]
known_semantic_fields: [payload_max, reach, grip_material, cycle_time]
n_episodes: 12
tasks_per_episode: 6
tolerance: 0.05
