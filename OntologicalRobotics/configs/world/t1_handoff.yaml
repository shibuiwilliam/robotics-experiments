# T1 越境同一性世界: アームA（棚を視認・バーコード可読）とモバイルB（搬出域のみ
# 視認・擬似LiDAR・ID不可読）。視界は重ならず、搬送中の箱は約1.5mの不可視区間を
# 通過する — 同一性解決（動きゲート）が無ければ業務上の対象特定が不可能な設計。
name: t1_handoff
physics_dt: 0.002
perception_hz: 2.0
eval_hz: 1.0
settle_s: 1.0
zones:
  # 棚は広め（箱間隔 ≥0.35m）— 搬送スクリプトが隣接箱を掠めて同一性が汚染
  # されない間隔を確保する
  - {name: shelf_a, center: [0.0,  1.2, 0.45], size: [2.4, 0.6, 0.35]}
  - {name: corridor, center: [0.0, 0.0, 0.15], size: [2.4, 0.9, 0.30]}
  - {name: handoff, center: [0.0, -1.2, 0.15], size: [1.4, 0.7, 0.30]}
boxes:
  # 棚: バーコード付き4（ターゲット候補）＋ID無し2（デコイ候補）
  - {name: b1, zone: shelf_a, barcode: BC-001, rgba: [0.85, 0.30, 0.25, 1.0]}
  - {name: b2, zone: shelf_a, barcode: BC-002, rgba: [0.25, 0.60, 0.85, 1.0]}
  - {name: b3, zone: shelf_a, barcode: BC-003, rgba: [0.30, 0.75, 0.35, 1.0]}
  - {name: b4, zone: shelf_a, barcode: BC-004, rgba: [0.85, 0.65, 0.20, 1.0]}
  - {name: n1, zone: shelf_a, barcode: null,   rgba: [0.60, 0.35, 0.75, 1.0]}
  - {name: n2, zone: shelf_a, barcode: null,   rgba: [0.45, 0.55, 0.50, 1.0]}
  # 搬出域の常駐ディストラクタ（ID無し、Bだけが見ている）
  - {name: d1, zone: handoff, barcode: null,   rgba: [0.70, 0.70, 0.30, 1.0]}
  - {name: d2, zone: handoff, barcode: null,   rgba: [0.35, 0.65, 0.70, 1.0]}
robots:
  - name: arm_a
    vendor_schema: vendor_arm_a
    camera: {pos: [0.0, 2.6, 1.4], lookat: [0.0, 1.2, 0.3], fovy: 78.0}
    detection_range: 2.3
    barcode_read_range: 2.2
  - name: mobile_b
    vendor_schema: vendor_mobile_b
    camera: {pos: [0.0, -2.6, 1.4], lookat: [0.0, -1.2, 0.3], fovy: 78.0}
    detection_range: 2.3
    barcode_read_range: 0.0   # 擬似LiDAR: 記号ID読取不可
    visual_embedding: false
# T1標準の劣化条件（クリーン過ぎる勝ち確を避ける。掃引はP4）
degradation:
  id_read_failure_rate: 0.05
  pose_noise_sigma: 0.02
  occlusion_rate: 0.02
# scripted_moves はT1ジェネレータがシード毎に注入する
