# S6 リサイクル選別世界（T13）。ID無し廃棄物の視覚クラスと規制レーン。
# 規制規則(disposal_route)は非自明: クラス名≠レーン名。OR-vec は接地できても規制推論が無く誤る。
# コスト行列は非対称: 電池の誤レーン＝発火リスク（高コスト）。
classes: [battery, freon, inert]
lanes: [fire_lane, ozone_lane, general]
default_lane: general   # 規制推論が無い OR-vec が全件ここへ流す（電池を誤る）
disposal_route:
  battery: fire_lane     # リチウムイオン → 発火リスクレーン
  freon: ozone_lane      # フロン → オゾン規制経路
  inert: general
cost:
  battery: {fire_lane: 0.0, ozone_lane: 60.0, general: 100.0}   # 発火見逃し=高コスト
  freon:   {fire_lane: 30.0, ozone_lane: 0.0, general: 40.0}
  inert:   {fire_lane: 5.0,  ozone_lane: 5.0, general: 0.0}
escalation_cost: 3.0
embedding_dim: 16
n_objects: 12
