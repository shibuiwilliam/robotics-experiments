# T2 業務‐物理クエリ世界: 8バーコード箱（=8受注）＋ID無し2箱。
# 3箱が搬出域へ搬送される（搬出域はID不可読のモバイルBのみが視認 — 「いまどこ」は
# 同一性解決＋アイデンティティ・スレッド無しには答えられない）。
name: t2_warehouse
physics_dt: 0.002
perception_hz: 2.0
eval_hz: 1.0
settle_s: 1.0
zones:
  - {name: shelf_a, center: [0.0,  1.2, 0.45], size: [2.4, 0.6, 0.35]}
  - {name: corridor, center: [0.0, 0.0, 0.15], size: [2.4, 0.9, 0.30]}
  - {name: handoff, center: [0.0, -1.2, 0.15], size: [1.4, 0.7, 0.30]}
boxes:
  - {name: b1, zone: shelf_a, barcode: BC-101, rgba: [0.85, 0.30, 0.25, 1.0]}
  - {name: b2, zone: shelf_a, barcode: BC-102, rgba: [0.25, 0.60, 0.85, 1.0]}
  - {name: b3, zone: shelf_a, barcode: BC-103, rgba: [0.30, 0.75, 0.35, 1.0]}
  - {name: b4, zone: shelf_a, barcode: BC-104, rgba: [0.85, 0.65, 0.20, 1.0]}
  - {name: b5, zone: shelf_a, barcode: BC-105, rgba: [0.60, 0.35, 0.75, 1.0]}
  - {name: b6, zone: shelf_a, barcode: BC-106, rgba: [0.45, 0.55, 0.50, 1.0]}
  - {name: b7, zone: shelf_a, barcode: BC-107, rgba: [0.20, 0.45, 0.75, 1.0]}
  - {name: b8, zone: shelf_a, barcode: BC-108, rgba: [0.75, 0.45, 0.55, 1.0]}
  - {name: n1, zone: handoff, barcode: null,   rgba: [0.70, 0.70, 0.30, 1.0]}
  - {name: n2, zone: handoff, barcode: null,   rgba: [0.35, 0.65, 0.70, 1.0]}
robots:
  # カメラは高所から見下ろす（後列の箱が前列を恒常遮蔽しない仰角を確保）
  - name: arm_a
    vendor_schema: vendor_arm_a
    camera: {pos: [0.0, 2.4, 2.0], lookat: [0.0, 1.2, 0.3], fovy: 78.0}
    detection_range: 2.6
    barcode_read_range: 2.3
  - name: mobile_b
    vendor_schema: vendor_mobile_b
    camera: {pos: [0.0, -2.4, 2.0], lookat: [0.0, -1.2, 0.3], fovy: 78.0}
    detection_range: 2.6
    barcode_read_range: 0.0
    visual_embedding: false
# 3箱を時間差で搬出（同一性ブリッジが必要になる）
scripted_moves:
  - {box: b2, at_time: 4.0,  to_zone: handoff, mode: slide, duration_s: 6.0, offset: [-0.45, 0.25]}
  - {box: b5, at_time: 7.0,  to_zone: handoff, mode: slide, duration_s: 6.0, offset: [0.0,  0.25]}
  - {box: b7, at_time: 10.0, to_zone: handoff, mode: slide, duration_s: 6.0, offset: [0.45, 0.25]}
degradation:
  id_read_failure_rate: 0.05
  pose_noise_sigma: 0.02
  occlusion_rate: 0.02
