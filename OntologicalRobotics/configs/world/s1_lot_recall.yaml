# S1 ロット回収世界（T8）: 平常ピッキング運転中に「ロット L-A 回収」の割込み。
# 回収対象ロット LOT-A の3個体は状態が散在する:
#   b1, b6 = 棚に静置（arm_a がバーコード可読）
#   b3     = 搬出域へ搬送済み（mobile_b=擬似LiDARのみ視認・バーコード不可読）
# → B0/B1 は b3（ID不可読の搬送済み個体）のロット帰属を解けず recall<1。
#   OR-full は越境同一性(H2)＋識別子スレッド(H6)で b3 を追跡し recall=1。
name: s1_lot_recall
physics_dt: 0.002
perception_hz: 2.0
eval_hz: 1.0
settle_s: 1.0
zones:
  - {name: shelf_a,    center: [0.0,  1.2, 0.45], size: [2.4, 0.6, 0.35]}
  - {name: corridor,   center: [0.0,  0.0, 0.15], size: [2.4, 0.9, 0.30]}
  - {name: handoff,    center: [0.0, -1.2, 0.15], size: [1.4, 0.7, 0.30]}
  - {name: quarantine, center: [2.2, -1.2, 0.15], size: [1.0, 0.7, 0.30]}
boxes:
  - {name: b1, zone: shelf_a, barcode: BC-101, lot: LOT-A, rgba: [0.85, 0.30, 0.25, 1.0]}
  - {name: b2, zone: shelf_a, barcode: BC-102, lot: LOT-B, rgba: [0.25, 0.60, 0.85, 1.0]}
  - {name: b3, zone: shelf_a, barcode: BC-103, lot: LOT-A, rgba: [0.30, 0.75, 0.35, 1.0]}
  - {name: b4, zone: shelf_a, barcode: BC-104, lot: LOT-C, rgba: [0.85, 0.65, 0.20, 1.0]}
  - {name: b5, zone: shelf_a, barcode: BC-105, lot: LOT-B, rgba: [0.60, 0.35, 0.75, 1.0]}
  - {name: b6, zone: shelf_a, barcode: BC-106, lot: LOT-A, rgba: [0.45, 0.55, 0.50, 1.0]}
  - {name: b7, zone: shelf_a, barcode: BC-107, lot: LOT-C, rgba: [0.20, 0.45, 0.75, 1.0]}
  - {name: b8, zone: shelf_a, barcode: BC-108, lot: LOT-C, rgba: [0.75, 0.45, 0.55, 1.0]}
  - {name: n1, zone: handoff, barcode: null,   lot: null,  rgba: [0.70, 0.70, 0.30, 1.0]}
  - {name: n2, zone: handoff, barcode: null,   lot: null,  rgba: [0.35, 0.65, 0.70, 1.0]}
robots:
  - name: arm_a
    vendor_schema: vendor_arm_a
    camera: {pos: [0.0, 2.4, 2.0], lookat: [0.0, 1.2, 0.3], fovy: 78.0}
    detection_range: 2.6
    barcode_read_range: 2.3
  - name: mobile_b
    vendor_schema: vendor_mobile_b
    camera: {pos: [0.0, -2.4, 2.0], lookat: [0.0, -1.2, 0.3], fovy: 78.0}
    detection_range: 2.6
    barcode_read_range: 0.0
    visual_embedding: false
# 進行中の搬送（割込み前から動いている）: b3(回収対象) と b5(非対象) が搬出域へ
scripted_moves:
  - {box: b3, at_time: 4.0, to_zone: handoff, mode: slide, duration_s: 6.0, offset: [-0.4, 0.25]}
  - {box: b5, at_time: 5.0, to_zone: handoff, mode: slide, duration_s: 6.0, offset: [0.4, 0.25]}
degradation:
  id_read_failure_rate: 0.0
  pose_noise_sigma: 0.0
  occlusion_rate: 0.0
