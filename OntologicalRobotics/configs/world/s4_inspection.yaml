# S4 プラント点検世界（T11）。資産台帳(P&ID)個体↔2視点知覚個体の ID無し同一化＋信念調停。
# 設計意図:
#  - 近接ペア(V-205/V-206, P-101/G-301)を置き、位置単独(OR-sym)では対応が曖昧。
#    OR-full は固有の視覚署名で同定を維持。
#  - 異常資産(V-205, V-410)は ドローン(上方)=正常(低確信) と 地上(近接)=異常(高確信) が矛盾。
#    信念調停(確信度加重)が無いと見逃す(OR-no-belief)。
assets:
  - {asset_id: V-205, system: cooling_loop, ledger_pos: [0.0, 0.0],  true_pos: [0.0, 0.0],  true_anomaly: true}
  - {asset_id: V-206, system: cooling_loop, ledger_pos: [0.3, 0.1],  true_pos: [0.3, 0.1],  true_anomaly: false}
  - {asset_id: P-101, system: cooling_loop, ledger_pos: [5.0, 0.0],  true_pos: [5.0, 0.0],  true_anomaly: false}
  - {asset_id: G-301, system: steam_line,   ledger_pos: [5.2, 0.25], true_pos: [5.2, 0.25], true_anomaly: false}
  - {asset_id: V-410, system: steam_line,   ledger_pos: [10.0, 5.0], true_pos: [10.0, 5.0], true_anomaly: true}
  - {asset_id: I-500, system: feedwater,    ledger_pos: [2.0, 8.0],  true_pos: [2.0, 8.0],  true_anomaly: false}
sop:
  cooling_loop: SOP-CL-12
  steam_line: SOP-ST-07
  feedwater: SOP-FW-03
embedding_dim: 16
position_noise: 0.4
ledger_noise: 0.3
signature_noise: 0.12
ref_noise: 0.08
drone_detect_conf: 0.5
ground_detect_conf: 0.9
normal_conf: 0.8
