# S8 fulfillment world (T15・キネティック層): エージェントがアクションを発行して
# move / dispose / deliver オーダを遂行する。条件間の差は「アクションの送信基準を
# 検証する共通オントロジーの有無」。失敗予言が構造的に成立するよう世界を構成する:
#  - heavy: 重量物（payload>=7）。能力契約を語彙横断できないと不適合機体を選ぶ（H1/H3）。
#  - reagent_zeta: ドメイン固有規制（atrium 禁止・LLM常識に無い）。規範を知らないと違反（H5/H8）。
#  - personal item: 所有者の部屋へ配送。所有関係を知らないと誤配送（H2/H6）。
name: s8_fulfillment
physics_dt: 0.002
perception_hz: 2.0
eval_hz: 1.0
settle_s: 1.0
zones:
  - {name: shelf,     center: [0.0,  0.6, 0.45], size: [1.8, 0.5, 0.35]}
  - {name: dock,      center: [0.0, -0.9, 0.15], size: [1.4, 0.6, 0.30]}
  - {name: biohazard, center: [1.4, -0.9, 0.15], size: [0.8, 0.6, 0.30]}
  - {name: atrium,    center: [-1.4, 0.0, 0.15], size: [0.8, 1.2, 0.30]}
  - {name: room_101,  center: [1.4,  0.6, 0.15], size: [0.8, 0.5, 0.30]}
  - {name: room_102,  center: [-1.4, 0.6, 0.15], size: [0.8, 0.5, 0.30]}
boxes:
  - {name: hv, zone: shelf, barcode: BC-HV, weight_kg: 7.0, material: steel,
     rgba: [0.55, 0.55, 0.60, 1.0]}
  - {name: rg, zone: shelf, barcode: BC-RG, weight_kg: 1.0, material: glass,
     rgba: [0.30, 0.75, 0.35, 1.0]}
  - {name: pi, zone: shelf, barcode: BC-PI, weight_kg: 0.6, material: cardboard,
     rgba: [0.85, 0.55, 0.20, 1.0]}
  - {name: dx, zone: shelf, barcode: BC-DX, weight_kg: 0.6, material: cardboard,
     rgba: [0.60, 0.35, 0.75, 1.0]}
robots:
  # 列順で先頭。共通能力オントロジーが無いと B1/B0 はここ（軽量機）を選んでしまう。
  - name: r_light
    vendor_schema: vendor_arm_b
    camera: {pos: [-1.6, -0.1, 1.2], lookat: [0.0, 0.4, 0.3], fovy: 75.0}
    detection_range: 4.0
    barcode_read_range: 3.5
    skill_truth: {max_payload_kg: 2.0, reach_m: 3.5, base_success: 1.0, overload_success: 0.0}
    capability: {declared_payload_kg: 2.0, declared_reach_m: 3.5}
  - name: r_heavy
    vendor_schema: vendor_arm_a
    camera: {pos: [1.6, -0.1, 1.2], lookat: [0.0, 0.4, 0.3], fovy: 75.0}
    detection_range: 4.0
    barcode_read_range: 3.5
    skill_truth: {max_payload_kg: 10.0, reach_m: 3.5, base_success: 1.0, overload_success: 0.0}
    capability: {declared_payload_kg: 10.0, declared_reach_m: 3.5}
