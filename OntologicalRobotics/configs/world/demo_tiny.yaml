# P0 デモ世界: 1アーム・8箱（うち5にバーコード）・2ゾーン・1スクリプト遷移
# `orx demo` / CQ回帰 / リプレイ同一性テストの正準フィクスチャ
name: demo_tiny
physics_dt: 0.002      # 500Hz
perception_hz: 2.0
eval_hz: 1.0
settle_s: 1.0
zones:
  - {name: shelf_a, center: [0.0,  0.6, 0.45], size: [1.6, 0.5, 0.35]}
  - {name: dock,    center: [0.0, -0.8, 0.15], size: [1.2, 0.6, 0.30]}
boxes:
  - {name: b1, zone: shelf_a, barcode: BC-001, rgba: [0.85, 0.30, 0.25, 1.0]}
  - {name: b2, zone: shelf_a, barcode: BC-002, rgba: [0.25, 0.60, 0.85, 1.0]}
  - {name: b3, zone: shelf_a, barcode: BC-003, rgba: [0.30, 0.75, 0.35, 1.0]}
  - {name: b4, zone: shelf_a, barcode: null,   rgba: [0.80, 0.70, 0.25, 1.0]}
  - {name: b5, zone: shelf_a, barcode: null,   rgba: [0.60, 0.35, 0.75, 1.0]}
  - {name: b6, zone: dock,    barcode: BC-006, rgba: [0.85, 0.50, 0.20, 1.0]}
  - {name: b7, zone: dock,    barcode: BC-007, rgba: [0.35, 0.70, 0.70, 1.0]}
  - {name: b8, zone: dock,    barcode: null,   rgba: [0.55, 0.55, 0.55, 1.0]}
robots:
  - name: arm_a
    vendor_schema: vendor_arm_a
    camera: {pos: [1.8, -0.1, 1.3], lookat: [0.0, 0.0, 0.3], fovy: 75.0}
    detection_range: 4.0
    barcode_read_range: 3.5
scripted_moves:
  - {box: b3, at_time: 8.0, to_zone: dock}
