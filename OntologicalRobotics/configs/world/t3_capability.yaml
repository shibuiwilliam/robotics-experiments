# T3/T6 能力考慮計画世界: 2アーム（軽量・高精度 vs 重量・低精度）。
# 重量/素材で「正しいロボットを選ばないと失敗する」割当課題（H3）。
# arm_heavy は反射素材への弱さを宣言していない（過信）— 台帳が経験で較正する (T6)。
name: t3_capability
physics_dt: 0.002
perception_hz: 2.0
eval_hz: 1.0
settle_s: 1.0
zones:
  - {name: shelf_a, center: [0.0, 1.2, 0.45], size: [2.4, 0.6, 0.35]}
  - {name: dock,    center: [0.0, -1.2, 0.15], size: [1.4, 0.7, 0.30]}
boxes:
  - {name: b1, zone: shelf_a, barcode: BC-301, weight_kg: 0.8, material: cardboard,  rgba: [0.85, 0.30, 0.25, 1.0]}
  - {name: b2, zone: shelf_a, barcode: BC-302, weight_kg: 1.2, material: reflective, rgba: [0.75, 0.75, 0.80, 1.0]}
  - {name: b3, zone: shelf_a, barcode: BC-303, weight_kg: 1.5, material: glass,      rgba: [0.30, 0.75, 0.85, 1.0]}
  - {name: b4, zone: shelf_a, barcode: BC-304, weight_kg: 2.5, material: cardboard,  rgba: [0.85, 0.65, 0.20, 1.0]}
  - {name: b5, zone: shelf_a, barcode: BC-305, weight_kg: 5.5, material: cardboard,  rgba: [0.60, 0.35, 0.75, 1.0]}
  - {name: b6, zone: shelf_a, barcode: BC-306, weight_kg: 6.5, material: reflective, rgba: [0.55, 0.55, 0.60, 1.0]}
  - {name: b7, zone: shelf_a, barcode: BC-307, weight_kg: 0.6, material: reflective, rgba: [0.70, 0.70, 0.75, 1.0]}
  - {name: b8, zone: shelf_a, barcode: BC-308, weight_kg: 1.8, material: glass,      rgba: [0.35, 0.65, 0.70, 1.0]}
robots:
  - name: arm_light
    vendor_schema: vendor_arm_a
    camera: {pos: [-0.9, 2.4, 2.0], lookat: [0.0, 1.2, 0.3], fovy: 78.0}
    detection_range: 3.0
    barcode_read_range: 2.8
    skill_truth:
      max_payload_kg: 2.0
      reach_m: 3.5
      base_success: 0.95
      overload_success: 0.05
      material_success: {reflective: 0.85, glass: 0.90}
    capability:
      skills: [pick_and_place]
      declared_payload_kg: 2.0
      declared_reach_m: 3.5
      prior_success: 0.90
  - name: arm_heavy
    vendor_schema: vendor_arm_a
    camera: {pos: [0.9, 2.4, 2.0], lookat: [0.0, 1.2, 0.3], fovy: 78.0}
    detection_range: 3.0
    barcode_read_range: 2.8
    skill_truth:
      max_payload_kg: 8.0
      reach_m: 3.5
      base_success: 0.90
      overload_success: 0.10
      material_success: {reflective: 0.35, glass: 0.60}   # 宣言されていない弱点
    capability:
      skills: [pick_and_place]
      declared_payload_kg: 8.0
      declared_reach_m: 3.5
      prior_success: 0.90    # 過信した宣言 — T6の較正対象
degradation:
  id_read_failure_rate: 0.02
  pose_noise_sigma: 0.01
  occlusion_rate: 0.0
