# S2 アレルゲン交差汚染世界カタログ（T9）。接触/洗浄スケジュールは生成器がシード毎に作る。
# 越境連鎖: arm が g_a–source(peanut)・g_a–tray を観測、cobot が g_b–tray を観測 →
# g_b は arm 観測の tray 汚染経由で汚染される。共通オントロジー無しの B1 は横断融合できず取りこぼす。
allergens: [peanut, gluten]
grippers: [g_a, g_b]
trays: [tray1]
robots: [arm, cobot]   # 観測ロボット（横断不可能性の源）
products:
  - {name: prod_peanut, intrinsic: [peanut]}   # 源（ピーナッツ含有）
  - {name: prod_free_1, intrinsic: []}
  - {name: prod_free_2, intrinsic: []}
  - {name: prod_free_3, intrinsic: []}
