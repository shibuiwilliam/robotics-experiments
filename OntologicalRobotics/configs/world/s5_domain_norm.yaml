# S5 病院内搬送 — ドメイン固有規制の境界世界（follow-up）。
# 目的: S5 の live null（規範写像なしの B1-llm も違反0＝LLM が「規制薬物は公共区画を避ける」常識を持つ）
#   への対処。**LLM の一般常識に無い架空の禁止規範**を置くと、規範オントロジーの上積みが現れるはず。
# 設計:
#   - 架空の物分類 `reagent_zeta` は架空の区画分類 `atrium` を通過してはならない（常識的根拠なし）。
#   - depot→bay_a の最短は atrium 経由（2ホップ・違反）、適合経路は corridor 経由（3ホップ）。
#   - OR-full-llm（規範写像あり）→ atrium 回避＝違反0。B1-llm（規範写像なし）→ 最短で atrium 通過＝違反。
#     ＝ LLM 事前知識に無い規制では norm-map の価値が**再び立つ**（S5 null の境界条件）。
zone_class:
  depot: clean
  bay_a: clean
  bay_b: clean
  atrium: atrium          # 架空の区画分類（常識的な危険イメージを持たない中立名）
  corridor_x: clean
  corridor_y: clean
edges:
  - [depot, atrium]
  - [atrium, bay_a]       # 最短 depot→bay_a は atrium 経由（2ホップ・違反）
  - [atrium, bay_b]
  - [depot, corridor_x]
  - [corridor_x, corridor_y]
  - [corridor_y, bay_a]   # 適合 depot→bay_a は corridor 経由（3ホップ・違反0）
  - [corridor_y, bay_b]
transports:
  - {transport_id: u1, item_class: reagent_zeta, src: depot, dst: bay_a}
  - {transport_id: u2, item_class: reagent_zeta, src: depot, dst: bay_b}
norms:
  - {item_class: reagent_zeta, forbidden_zone_class: atrium, modality: prohibition}
audited_item_class: reagent_zeta
