id: cq_s5_custody_chain
question: "ある搬送物の custody 連鎖（全通行区画を順序付き）は何か（監査クエリ）？"
sparql: |
  PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
  PREFIX orx-norm: <https://orx.local/onto/norm#>
  SELECT ?step ?item ?zone ?idx WHERE {
    GRAPH <https://orx.local/id/graph/current> {
      ?step rdf:type orx-norm:CustodyStep ;
            orx-norm:custodyOf ?item ;
            orx-norm:atZone ?zone ;
            orx-norm:stepIndex ?idx .
    }
  }
note: "規制薬物の全custody連鎖を再構成する監査クエリ。来歴記録が無いと完全回答できない。"
