id: cq_s6_disposal_route
question: "各規制クラスの規定処理レーンは何か（規制規則・記号側）？"
sparql: |
  PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
  PREFIX orx-biz: <https://orx.local/onto/biz#>
  SELECT ?cls ?lane WHERE {
    GRAPH <https://orx.local/id/graph/current> {
      ?cls rdf:type orx-biz:RegulatedClass ; orx-biz:disposalRoute ?lane .
    }
  }
note: "OR-full が使う規制推論の核。OR-vec はこの記号規則を持たず誤レーンになる。"
