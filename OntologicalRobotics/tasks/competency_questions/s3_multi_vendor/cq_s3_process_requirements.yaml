id: cq_s3_process_requirements
question: "各工程の要求（重量帯・素材）は何か（SOPの構造化要件）？"
sparql: |
  PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
  PREFIX orx-cap: <https://orx.local/onto/cap#>
  SELECT ?req ?payload ?material WHERE {
    GRAPH <https://orx.local/id/graph/current> {
      ?req rdf:type orx-cap:ProcessRequirement ;
           orx-cap:requiresPayloadKg ?payload ;
           orx-cap:requiresMaterial ?material .
    }
  }
note: "OR-full が能力契約と突合せる工程要求。B1 はこの語彙を他ベンダーへ翻訳できない。"
