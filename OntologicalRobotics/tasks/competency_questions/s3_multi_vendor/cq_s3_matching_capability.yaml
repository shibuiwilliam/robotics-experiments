id: cq_s3_matching_capability
question: "ある工程要求に語彙横断で適合する能力契約はどれか（OR-fullの導出）？"
sparql: |
  PREFIX orx-cap: <https://orx.local/onto/cap#>
  SELECT ?req ?cap ?robot WHERE {
    GRAPH <https://orx.local/id/graph/current> {
      ?req orx-cap:matchesCapability ?cap .
      ?cap orx-cap:forRobot ?robot .
    }
  }
note: "工程要求×能力契約のベンダー非依存マッチ。能力統合(H3)の核。"
