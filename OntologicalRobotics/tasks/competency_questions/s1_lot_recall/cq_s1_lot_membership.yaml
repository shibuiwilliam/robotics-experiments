id: cq_s1_lot_membership
question: "ロット L のメンバー個装（バーコード）一覧は？"
sparql: |
  PREFIX orx-biz: <https://orx.local/onto/biz#>
  SELECT ?bc WHERE {
    GRAPH <https://orx.local/id/graph/current> {
      ?si orx-biz:memberOfLot <https://orx.local/id/lot/{lot}> ;
          orx-biz:hasBarcode ?bc .
    }
  }
note: "識別子スレッド（memberOfLot↔hasBarcode）の存在確認。業務側のみで閉じる。"
