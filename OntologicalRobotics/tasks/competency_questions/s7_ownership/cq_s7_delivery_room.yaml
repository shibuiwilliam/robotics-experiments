id: cq_s7_delivery_room
question: "ある入居者の所有物はどの居室へ配送すべきか（業務-物理クエリ, H6）？"
sparql: |
  PREFIX orx-biz: <https://orx.local/onto/biz#>
  SELECT ?resident ?item ?room WHERE {
    GRAPH <https://orx.local/id/graph/current> {
      ?resident orx-biz:owns ?item ; orx-biz:assignedRoom ?room .
    }
  }
note: "『誰のものをどこへ』を真値照合で解く（H6）。所有関係が無いと答えられない。"
