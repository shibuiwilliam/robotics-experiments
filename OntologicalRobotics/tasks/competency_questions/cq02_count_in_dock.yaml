id: cq02_count_in_dock
question: "ドック (dock) に現在ある箱は何個か"
sparql: |
  PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
  PREFIX orx-upper: <https://orx.local/onto/upper#>
  PREFIX orx-st: <https://orx.local/onto/st#>
  SELECT (COUNT(DISTINCT ?e) AS ?n) WHERE {
    GRAPH <https://orx.local/id/graph/current> {
      ?e rdf:type orx-upper:Box ;
         orx-st:inZone <https://orx.local/id/zone/dock> .
    }
  }
truth_fn: count_in_zone
truth_args: {zone: dock}
compare: count
