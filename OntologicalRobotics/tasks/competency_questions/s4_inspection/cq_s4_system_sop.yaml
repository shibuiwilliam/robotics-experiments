id: cq_s4_system_sop
question: "各資産はどの系統に属し、異常時に適用すべきSOPは何か？"
sparql: |
  PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
  PREFIX orx-biz: <https://orx.local/onto/biz#>
  SELECT ?asset ?system WHERE {
    GRAPH <https://orx.local/id/graph/current> {
      ?asset rdf:type orx-biz:Asset ; orx-biz:inSystem ?system .
    }
  }
note: "異常→該当系統→SOP→作業指示の連鎖の起点（系統トポロジ）。"
