[project]
name = "orx"
version = "0.0.1"
description = "ORX (Ontological Robotics eXperiments) — MuJoCoシミュレーション上でOntological Roboticsの有効性を反証可能な形で検証する研究基盤"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.2",
    "pyoxigraph>=0.4",
    "pyshacl>=0.26",
    "rdflib>=7.0",
    "lancedb>=0.16",
    "open-clip-torch>=2.24",
    "openai>=1.40",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "typer>=0.12",
    "structlog>=24.1",
]

[project.scripts]
orx = "orx.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# T20: print禁止（CLAUDE.md §4 — printデバッグを残さない。CLI出力はtyper.echo）
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.importlinter]
root_package = "orx"

# CLAUDE.md §3 モジュール依存方向:
#   common ← {sim, skills, business, perception} ← anchoring ← kg ← agent ← exp
#   oracle は sim真値と評価のみに依存し、ORコア(anchoring/kg/agent)と相互不可侵。

[[tool.importlinter.contracts]]
name = "common は他の orx モジュールに依存しない"
type = "forbidden"
source_modules = ["orx.common"]
forbidden_modules = [
    "orx.sim", "orx.skills", "orx.business", "orx.perception",
    "orx.anchoring", "orx.kg", "orx.agent", "orx.oracle", "orx.replay", "orx.exp",
]

[[tool.importlinter.contracts]]
name = "センサ・実効層は上位層(anchoring/kg/agent/exp)に依存しない"
type = "forbidden"
source_modules = ["orx.sim", "orx.skills", "orx.business", "orx.perception"]
forbidden_modules = ["orx.anchoring", "orx.kg", "orx.agent", "orx.exp"]

[[tool.importlinter.contracts]]
name = "anchoring は kg/agent/exp に依存しない"
type = "forbidden"
source_modules = ["orx.anchoring"]
forbidden_modules = ["orx.kg", "orx.agent", "orx.exp"]

[[tool.importlinter.contracts]]
name = "kg は agent/exp に依存しない"
type = "forbidden"
source_modules = ["orx.kg"]
forbidden_modules = ["orx.agent", "orx.exp"]

[[tool.importlinter.contracts]]
name = "agent は exp に依存しない"
type = "forbidden"
source_modules = ["orx.agent"]
forbidden_modules = ["orx.exp"]

[[tool.importlinter.contracts]]
name = "oracle(C8) は ORコアを import しない (PROJECT.md §5.2-不変条件, CLAUDE.md §3.4)"
type = "forbidden"
source_modules = ["orx.oracle"]
forbidden_modules = ["orx.anchoring", "orx.kg", "orx.agent", "orx.replay", "orx.exp"]

[[tool.importlinter.contracts]]
name = "ORコアは oracle を import しない (評価の独立性)"
type = "forbidden"
source_modules = [
    "orx.sim", "orx.skills", "orx.business", "orx.perception",
    "orx.anchoring", "orx.kg", "orx.agent",
]
forbidden_modules = ["orx.oracle"]
